# https://github.com/crate-ci/typos/blob/v1.50.3/docs/reference.md

[default]
# Tool names that typos reads as misspellings.
extend-ignore-re = [
  "commandbox",
  "muc --count",
  "tre-command",
  # Commit SHAs cited in docs/mise-migration that contain dictionary fragments.
  "\\b3eb7ca366dbe\\b",
  "\\b5c9a7ba\\b",
  # Harper rule name in the hk configuration.
  "TheirToTheyre",
]

[files]
# Legacy records the conversion build writes back at the root, typos included,
# and the E030 source, which keeps the audited-tip bytes apart from #389's edit.
extend-exclude = [
  "docs/mise-migration/lab/rewrites/",
  "docs/mise-migration/lab/sources/.config/shell/functions.sh",
]
