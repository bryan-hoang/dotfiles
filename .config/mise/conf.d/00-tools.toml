[tool_alias]
ado-mcp = "npm:@azure-devops/mcp"
box = "http:command-box"
cargo-cache = "cargo:cargo-cache"
cflint = "github:cfmleditor/cflint"
cocogitto = "cargo:cocogitto"
dab = "dotnet:microsoft.dataapibuilder"
delta = "cargo:git-delta"
diff-pdf = "github:vslavik/diff-pdf"
dtctl = "github:dynatrace-oss/dtctl"
ec = "aqua:editorconfig-checker/editorconfig-checker"
fff-mcp = "github:dmtrkovalenko/fff"
ffmpeg = "github:btbn/ffmpeg-builds"
gfr = "pipx:git-filter-repo"
git-absorb = "cargo:git-absorb"
git-grab = "cargo:git-grab"
herdr = "github:herdrdev/herdr"
lychee = "cargo:lychee"
monaco = "github:dynatrace/dynatrace-configuration-as-code"
mpv = "github:mpv-player/mpv"
opencode2 = "npm:@opencode-ai/cli"
pac = "dotnet:microsoft.powerapps.cli.tool"
rage = "github:str4d/rage"
rtk = "github:rtk-ai/rtk"
sccache = "cargo:sccache"
sd = "github:chmln/sd"
sfw = "npm:sfw"
skills = "npm:skills"
sqlcmd = "github:microsoft/go-sqlcmd"
sqlfluff = "pipx:sqlfluff"
sqlpackage = "dotnet:microsoft.sqlpackage"
television = "cargo:television"
tspin = "cargo:tailspin"
vp = "github:voidzero-dev/vite-plus"
vscode-lsp = "npm:vscode-langservers-extracted"
whisper-cpp = "github:ggml-org/whisper.cpp"
xmlstarlet = "http:xmlstarlet"

# `pipx` backend doesn't work on windows
azure-cli = "github:azure/azure-cli"
# Built-in alias doesn't work on windows
gs = "go:github.com/sigstore/gitsign"
# Aqua backend doesn't support windows
hunkdiff = "npm:hunkdiff"
# Aqua backend doesn't support renaming the binary to `.exe` on windows
sonarqube-cli = "http:sonarqube-cli"

[tools]
actionlint = { version = "latest", lazy = true }
aube = { version = "latest", minimum_release_age = "0d" }
betterleaks = "latest"
bun = { version = "latest", lazy = true }
cargo-binstall = "latest"
cargo-cache = "latest"
cocogitto = "latest"
delta = "latest"
ec = "latest"
eza = "latest"
gh = "latest"
git-absorb = "latest"
git-grab = "latest"
go = "latest"
gs = "latest"
harper-cli = "latest"
harper-ls = "latest"
herdr = { version = "latest", lazy = true, version_prefix = "preview-", prerelease = "true", minimum_release_age = "0d" }
hk = { version = "latest", minimum_release_age = "0d" }
hunkdiff = { version = "latest", lazy = true, trust_policy_excludes = [
  "@pierre/theme",
] }
jaq = "latest"
lychee = "latest"
node = "latest"
opencode = { version = "latest", lazy = true, minimum_release_age = "0d" }
opencode2 = { version = "next", lazy = true, lazy_bins = [
  "opencode2",
], minimum_release_age = "0d", allow_builds = [
  "@opencode-ai/cli",
] }
oxfmt = "latest"
oxlint = "latest"
pkl = "latest"
pnpm = { version = "latest", lazy = true, minimum_release_age = "0d" }
rmz = "latest"
rtk = "latest"
rumdl = "latest"
sccache = "latest"
sd = "latest"
sfw = "latest"
shellcheck = "latest"
shfmt = "latest"
skills = "latest"
starship = "latest"
taplo = "latest"
television = "latest"
tree-sitter = "latest"
tspin = "latest"
typos = "latest"
usage = { version = "latest", minimum_release_age = "0d" }
uv = "latest"
vscode-lsp = { version = "latest" }
yq = "latest"
zizmor = { version = "latest", lazy = true }
zoxide = "latest"

[tools.fff-mcp]
minimum_release_age = "0d"
version = "latest"

[tools.fff-mcp.platforms.windows-x64]
asset_pattern = 'fff-mcp-{{arch(x64="x86_64")}}-pc-{{os()}}-msvc.exe'
bin = "fff-mcp.exe"

[tools.xmlstarlet]
rename_exe = "xmlstarlet.exe"
version = "latest"
version_expr = "sortVersions(versions)"
version_list_url = 'https://sourceforge.net/projects/xmlstar/rss'
version_regex = '/xmlstarlet/(\d+\.\d+\.\d+)/xmlstarlet-\d+\.\d+\.\d+-win32\.zip'

[tools.xmlstarlet.platforms.windows-x64]
format = "zip"
url = 'https://sourceforge.net/projects/xmlstar/files/xmlstarlet/{{version}}/xmlstarlet-{{version}}-win32.zip/download'
